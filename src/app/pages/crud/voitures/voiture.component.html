<div class="card p-4 shadow-2 surface-card border-round-xl">

    <p-toolbar class="mb-4">
        <ng-template pTemplate="left">
            <h4 class="m-0">Gestion des Voitures</h4>
        </ng-template>
        <ng-template pTemplate="right">
            <button pButton icon="pi pi-plus" class="p-button-success" label="Ajouter" (click)="showAddDialog = true"></button>
            <button pButton icon="pi pi-trash" class="p-button-danger ms-2" label="Supprimer"
                    [disabled]="!selectedVoitures.length"
                    (click)="supprimerVoituresSelectionnees()"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="voitures" [(selection)]="selectedVoitures"
             dataKey="id" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5,10,20]"
             [responsiveLayout]="'scroll'" [globalFilterFields]="['matricule']" selectionMode="multiple">

        <ng-template pTemplate="caption">
            <div class="caption-container">
                <span class="text-lg font-semibold">Liste des voitures</span>
                <span class="p-input-icon-left search-wrapper">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" placeholder="Rechercher..." (input)="onGlobalFilter($event)" style="width:200px" />
                </span>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th style="width:3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
                <th>Matricule</th>
                <th>Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-voiture>
            <tr>
                <td><p-tableCheckbox [value]="voiture"></p-tableCheckbox></td>
                <td>{{ voiture.matricule }}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-warning me-2"
                            (click)="ouvrirModifierVoiture(voiture)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger"
                            (click)="supprimerVoiture(voiture.id, voiture.matricule)"></button>
                </td>
            </tr>
        </ng-template>

    </p-table>

    <!-- MODALE AJOUT -->
    <p-dialog header="Nouvelle Voiture" [(visible)]="showAddDialog" [modal]="true" [style]="{ width:'400px' }" [closable]="false">
        <ng-template pTemplate="content">
            <div class="p-fluid">
                <div class="field mb-3">
                    <label>Matricule</label>
                    <input pInputText [(ngModel)]="newVoiture.matricule" required />
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="footer">
            <button pButton label="Annuler" icon="pi pi-times" class="p-button-text" (click)="showAddDialog = false"></button>
            <button pButton label="Enregistrer" icon="pi pi-check" class="p-button-text" (click)="ajouterVoiture()"></button>
        </ng-template>
    </p-dialog>

    <!-- MODALE MODIFICATION -->
    <p-dialog header="Modifier Voiture" [(visible)]="showEditDialog" [modal]="true" [style]="{ width:'400px' }" [closable]="false">
        <ng-template pTemplate="content">
            <div class="p-fluid">
                <div class="field mb-3">
                    <label>Matricule</label>
                    <input pInputText [(ngModel)]="editVoiture.matricule" required />
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="footer">
            <button pButton label="Annuler" icon="pi pi-times" class="p-button-text" (click)="showEditDialog = false"></button>
            <button pButton label="Enregistrer" icon="pi pi-check" class="p-button-text" (click)="modifierVoiture()"></button>
        </ng-template>
    </p-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
